bind_addr = "0.0.0.0:8080"
# Số inference song song trên toàn server.
# Bất biến BẮT BUỘC: max_concurrent_inference * model.n_threads <= số core - 2.
# Vượt qua là sập, không phải chậm dần: ggml spin-wait ở barrier nên 4 stream x 8
# thread trên máy 16 core đo được RTF 2.19 (so với 0.033 khi 2 stream x 8 thread).
# Đo trên Core Ultra 9 285H (6 P-core + 8 E-core + 2 LP-E), model base, đoạn 20 s:
#   threads=8, streams=1 -> partial 257 ms, final 1128 ms, ~18.8 stream ở RTF=1
#   threads=4, streams=3 -> partial 317 ms, final 1326 ms, ~25.0 stream ở RTF=1
# Mặc định lấy cấu hình độ-trễ-thấp-nhất (1 stream, 12 thread) — cũng là cấu hình
# duy nhất chạy được large-v3-turbo trên CPU: turbo với 4 thread cho RTF 1,03,
# tức không kịp realtime dù chỉ một stream. Cần nhiều session thì hoặc lên GPU,
# hoặc dùng base/small rồi chia thành nhiều stream ít thread (4 thread x 3 stream
# cho throughput cao hơn 33%).
max_concurrent_inference = 1
# Tổng thread CPU cho MỌI model trong tiến trình (model chính + model partial dùng
# chung hạn mức này). 0 = tự lấy số core - 2.
# Bắt buộc phải dùng chung: đo được turbo 12 thread + base 12 thread chạy song song
# làm cả file 128 s tụt lại 93 s so với realtime — tệ hơn cả khi chỉ dùng turbo.
cpu_thread_budget = 0

[model]
path = "models/ggml-large-v3-turbo.bin"
# Rỗng = auto-detect (thêm một lượt decode, chậm hơn).
language = "vi"
# ĐỪNG đặt bằng số core: threads = nproc làm mọi thứ sập (đo được 14 thread trên
# 14 core chậm gấp 6 lần 12 thread). Chừa lại ít nhất 2 core.
n_threads = 12
use_gpu = true
gpu_device = 0
flash_attn = false
# <=1 = greedy. Beam chỉ dùng cho lượt Final, partial luôn greedy.
# Đo trên mẫu 128 s: greedy bỏ hẳn nội dung ở utterance dài (182 xoá / 469 từ, 0 thêm),
# beam 5 hạ WER so với bản decode offline từ 0,43 xuống 0,25, tốn thêm ~10% cho Final.
beam_size = 5
# Chunk ngắn hơn ngưỡng này bị bỏ: whisper pad mọi input lên 30 s nên decode
# 200 ms audio tốn gần bằng decode 30 s.
min_audio_ms = 1000
initial_prompt = ""
# Partial chỉ chạy encoder đúng độ dài cửa sổ thay vì luôn 30 s — khoản tiết kiệm
# lớn nhất của đường partial. Tắt nếu thấy rơi chữ ở cuối cửa sổ partial.
scale_partial_audio_ctx = true
# Bỏ segment mà whisper tự báo "không có tiếng nói" với xác suất cao hơn ngưỡng.
# Trên khoảng lặng, model sinh câu học từ dữ liệu train (kiểu "hãy đăng ký kênh");
# hạ ngưỡng nếu vẫn thấy ảo giác, nâng lên nếu bị rơi câu nói thật rất ngắn.
no_speech_thold = 0.6

# Model nhỏ chạy partial, model chính ở trên lo lượt chốt câu. Bỏ trống section này
# thì partial dùng luôn model chính. Đây là cách duy nhất để dùng large-v3-turbo mà
# partial vẫn nhanh: turbo cần ~2 s cho cửa sổ partial 6 s, base chỉ ~250 ms.
# Lưu ý chia thread: hai model dùng chung cpu_thread_budget, nên muốn partial chạy
# CHỒNG được với final thì tổng thread phải nằm trong hạn mức (ví dụ máy 16 core:
# hạn mức 14 = final 10 thread + partial 4 thread). Nếu tổng vượt hạn mức thì partial
# phải chờ final xong — vẫn đúng, nhưng mất hết cái lợi về độ trễ.
# [partial_model]
# path = "models/ggml-base.bin"
# language = "vi"
# n_threads = 4
# use_gpu = false
# min_audio_ms = 1000
# Khi đã có model partial nhanh thì hạ partial_interval_ms xuống 250 để text mượt hơn.
# max_concurrent_partial_inference = 1

[vad]
# Rỗng = energy VAD (chỉ nên dùng khi dev; nhạc/tiếng ồn sẽ bị tính là giọng nói).
model_path = "models/ggml-silero-v5.1.2.bin"
# Ngưỡng/độ dài im lặng quyết định chỗ cắt câu: nói chậm, nhiều khoảng nghỉ thì
# tăng silence_ms_for_end, nếu không câu sẽ bị cắt giữa cụm từ.
threshold = 0.5
silence_ms_for_end = 800
min_speech_ms = 128
n_threads = 2
use_gpu = false
# Cổng năng lượng đứng trước Silero: dưới ngưỡng này không chạy model VAD (tiết kiệm
# ~7-8 ms mỗi 256 ms audio mỗi session trên khoảng lặng). 0 = tắt. Phải nhỏ hơn
# threshold ở trên để không bao giờ chặn mất tiếng nói thật.
energy_gate_threshold = 0.15

[session]
# Chốt cưỡng bức nếu một lượt nói dài quá mức (giây).
max_utterance_secs = 25.0
# Partial chỉ decode đuôi này, không decode lại cả lượt nói.
partial_window_secs = 6.0
partial_interval_ms = 800
# Giữ 1 s audio trước khi VAD báo có tiếng: VAD trễ vài chục ms và ta chấm điểm theo
# cụm 256 ms, để 0,3-0,4 s là hay cắt mất từ đầu câu.
pre_roll_secs = 1.0
# VAD không theo kịp luồng vào thì bỏ phần chờ cũ nhất thay vì để độ trễ phình.
max_probe_backlog_secs = 2.0
# LocalAgreement-2 (whisper_streaming): chỉ hiện phần hai lượt decode partial liên
# tiếp đồng ý, và cắt audio đã chốt khỏi cửa sổ sau. Text không bị viết lại giữa các
# lượt cập nhật, và cửa sổ partial không phình theo độ dài lượt nói.
local_agreement = true
# Mồi lượt Final bằng text đã chốt trước đó (condition_on_previous_text của whisper).
# Giữ tên riêng nhất quán, nhưng ảo giác ở một lượt sẽ được mồi tiếp sang lượt sau.
condition_on_previous = false
